name: Generate Unicom Top 60

on:
  push:
    branches: [main]
    paths:
      - raw/results_unicom.csv
      - scripts/filter_ips.py
      - scripts/filter_unicom.py
      - tests/**
      - .github/workflows/filter-unicom.yml
  workflow_dispatch:
    inputs:
      endpoint_column:
        description: 'Optional endpoint/IP column: 1-based number or exact header'
        type: string
        default: ''
      port_column:
        description: 'Optional separate port column'
        type: string
        default: ''
      region_column:
        description: 'Optional source region column'
        type: string
        default: ''
      latency_column:
        description: 'Optional latency column'
        type: string
        default: ''

permissions:
  contents: read

# Share the publication lock with filter-ip.yml to avoid competing git pushes.
concurrency:
  group: preferred-ips-${{ github.ref }}
  cancel-in-progress: false

jobs:
  filter:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Run parser and quota regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v

      - name: Generate Unicom subscription
        env:
          ENDPOINT_COLUMN: ${{ inputs.endpoint_column }}
          PORT_COLUMN: ${{ inputs.port_column }}
          REGION_COLUMN: ${{ inputs.region_column }}
          LATENCY_COLUMN: ${{ inputs.latency_column }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          [[ -z "$ENDPOINT_COLUMN" ]] || args+=(--endpoint-column "$ENDPOINT_COLUMN")
          [[ -z "$PORT_COLUMN" ]] || args+=(--port-column "$PORT_COLUMN")
          [[ -z "$REGION_COLUMN" ]] || args+=(--region-column "$REGION_COLUMN")
          [[ -z "$LATENCY_COLUMN" ]] || args+=(--latency-column "$LATENCY_COLUMN")
          status=0
          python3 scripts/filter_unicom.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/unicom-report.txt" || status=$?
          {
            echo '### Unicom: JP 20 / US 30 / SG 10'
            echo "Exit status: $status"
            echo '```text'
            cat "$RUNNER_TEMP/unicom-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Publish changed Unicom subscription
        shell: bash
        run: |
          set -euo pipefail
          git add -- api/Unicom.txt
          if git diff --cached --quiet; then
            echo 'Unicom subscription unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'auto: update Unicom quota subscription'
          git push origin HEAD:main
