name: Test Preferred IP Parser

on:
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - raw/results.csv
      - .github/workflows/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run offline regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Check the uploaded data without publishing
        run: python3 scripts/filter_ips.py --output "$RUNNER_TEMP/preferred.txt"
