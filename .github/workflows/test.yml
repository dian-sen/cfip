name: Test Preferred IP Parser

on:
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - raw/results.csv
      - raw/results_unicom.csv
      - .github/workflows/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run offline regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Check the uploaded data without publishing
        run: python3 scripts/filter_ips.py --output "$RUNNER_TEMP/preferred.txt"
      - name: Preview Unicom quota subscription without publishing
        run: python3 scripts/filter_unicom.py --output "$RUNNER_TEMP/Unicom.txt"
