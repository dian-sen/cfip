name: Filter Preferred IPs by Region

on:
  push:
    paths:
      - 'raw/results.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Filter by region
        run: |
          python3 << 'EOF'
          import csv
          import os
          from collections import defaultdict

          # 源IP位置 里出现的简称 → 输出标签
          REGION_MAP = {
              "HK": "HK",
              "TW": "TW",
              "JP": "JP",
              "US": "US",
              "KR": "KR",
              "SG": "SG",
              "DE": "DE",
              # 兼容可能出现的机房码
              "HKG": "HK",
              "TPE": "TW",
              "NRT": "JP",
              "KIX": "JP",
              "HND": "JP",
              "ICN": "KR",
              "SIN": "SG",
              "FRA": "DE",
              "LAX": "US",
              "SJC": "US",
              "SEA": "US",
              "IAD": "US",
          }

          PER_REGION = 10
          INPUT = "raw/results.csv"
          OUTPUT = "api/preferred.txt"

          os.makedirs("api", exist_ok=True)

          if not os.path.exists(INPUT):
              print(f"ERROR: {INPUT} not found.")
              with open(OUTPUT, "w", encoding="utf-8") as f:
                  f.write("")
              raise SystemExit(1)

          def latency_key(r):
              val = str(r.get("网络延迟", "")).replace("ms", "").strip()
              try:
                  return float(val)
              except:
                  return 99999

          def get_region(r):
              loc = str(r.get("源IP位置", "")).strip().upper()
              return REGION_MAP.get(loc)

          buckets = defaultdict(list)

          with open(INPUT, newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              rows = list(reader)

          print(f"CSV rows: {len(rows)}")
          if rows:
              print(f"CSV headers: {list(rows[0].keys())}")

          rows.sort(key=latency_key)

          for r in rows:
              region = get_region(r)
              if not region:
                  continue
              if len(buckets[region]) >= PER_REGION:
                  continue

              ip_port = str(r.get("IP:PORT", "")).strip()
              if not ip_port:
                  continue

              # 已包含端口，直接使用
              line = f"{ip_port}#{region}"
              buckets[region].append(line)

          lines = []
          order = ["HK", "TW", "JP", "US", "KR", "SG", "DE"]
          for code in order:
              lines.extend(buckets.get(code, []))

          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + ("\n" if lines else ""))

          print("Generated counts:")
          for code in order:
              print(f"{code}: {len(buckets.get(code, []))}")
          print(f"Total: {len(lines)}")
          EOF

      - name: Commit filtered result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add api/preferred.txt
          git diff --staged --quiet || git commit -m "auto: filter preferred IPs by region"
          git push